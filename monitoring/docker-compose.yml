# Run this on the MONITORING VM (not on the app VM).
# 1. Edit prometheus.yml — replace APP_VM_IP with the app VM's internal IP.
# 2. docker compose up -d
# 3. Open Grafana at http://<monitoring-vm-ip>:3000 (admin / admin)
# 4. Add Prometheus data source: http://prometheus:9090
# 5. Import Node Exporter dashboard: https://grafana.com/grafana/dashboards/1860

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # Enable hot-reload: send SIGHUP or POST /-/reload
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
